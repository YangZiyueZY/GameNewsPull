name: 刷新二游资讯

on:
  schedule:
    # 每天 UTC 01:30 = 北京时间 09:30
    - cron: '30 1 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 抓取 B站官方动态并生成数据
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          CI: 'true'
        run: npm run crawl:once

      - name: 构建静态站点到 docs/
        run: npm run web:build

      - name: 提交变更
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/store.json docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo '无变更，跳过提交'
          else
            git commit -m "chore: 定时刷新资讯 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
